global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  # monitoring itself
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: [ "kafka-exporter:9308" ]

  - job_name: "order-execution-service"
    static_configs:
      - targets: [ "order-execution-service:1212" ]