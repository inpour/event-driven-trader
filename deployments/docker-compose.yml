name: event-driven-trader

services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: event-driven-trader-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  topic-init:
    image: apache/kafka:4.1.2
    container_name: event-driven-trader-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        echo "Creating Kafka topics..."
        
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic market.candle.closed \
          --partitions 1 \
          --replication-factor 1
        
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic backtest.input.completed \
          --partitions 1 \
          --replication-factor 1
        
        echo "Kafka topics after initialization:"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list

  market-data-service:
    build:
      context: ..
      dockerfile: services/market-data/Dockerfile
    container_name: event-driven-trader-market-data
    environment:
      CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ../services/market-data/configs/config.yaml:/app/config/config.yaml:ro
      - ../data/input:/app/data/input:ro
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully